<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aino — Selection Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E8;
    --panel:#FBF9F4;
    --ink:#211D17;
    --ink-muted:#6B6355;
    --line:#DAD3C2;
    --moss:#4B5D45;
    --moss-dim:#E4E9E0;
    --amber:#9C6B12;
    --amber-dim:#F1E6D2;
    --rust:#A9432B;
    --rust-dim:#F3E1DC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:270px;flex-shrink:0;
    background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;
    padding:22px 0;
  }
  .brand{padding:0 20px 18px;border-bottom:1px solid rgba(245,241,232,.15);margin-bottom:14px;}
  .brand .name{font-family:'Fraunces',serif;font-size:21px;font-weight:600;letter-spacing:.2px;}
  .brand .tag{font-size:11.5px;color:#C9C2AE;margin-top:3px;}
  .new-btn{
    margin:0 20px 16px;padding:10px 12px;
    background:var(--moss);color:#fff;border:none;border-radius:3px;
    font-family:'Inter';font-size:13px;font-weight:600;cursor:pointer;
    text-align:left;
  }
  .new-btn:hover{filter:brightness(1.08);}
  .queue-label{padding:0 20px;font-size:11px;color:#9A907C;margin-bottom:6px;}
  .queue{flex:1;overflow-y:auto;padding:0 8px;}
  .queue-item{
    padding:10px 12px;border-radius:3px;cursor:pointer;margin-bottom:2px;
    display:flex;flex-direction:column;gap:3px;
  }
  .queue-item:hover{background:rgba(245,241,232,.08);}
  .queue-item.active{background:rgba(245,241,232,.14);}
  .queue-item .qname{font-size:13px;font-weight:500;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .queue-item .qmeta{font-size:11px;color:#A79E89;display:flex;justify-content:space-between;}
  .queue-empty{padding:14px 20px;font-size:12.5px;color:#8D8471;}
  .badge{
    display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;
  }
  .badge.SELECT{background:var(--moss-dim);color:var(--moss);}
  .badge.TEST{background:var(--amber-dim);color:var(--amber);}
  .badge.HOLD{background:#EDE9DD;color:#8A806B;}
  .badge.REJECT{background:var(--rust-dim);color:var(--rust);}

  /* ---------- main ---------- */
  #main{flex:1;overflow-y:auto;padding:42px 48px 90px;}
  .wrap{max-width:840px;margin:0 auto;}
  .case-header{margin-bottom:26px;}
  .case-header h1{font-size:26px;margin:0 0 4px;font-weight:600;}
  .case-header .sub{color:var(--ink-muted);font-size:13.5px;}

  .stepper{display:flex;gap:0;margin-bottom:34px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel);}
  .step{flex:1;padding:11px 14px;font-size:12px;color:var(--ink-muted);border-right:1px solid var(--line);position:relative;}
  .step:last-child{border-right:none;}
  .step .n{font-family:'IBM Plex Mono';font-size:11px;margin-right:6px;}
  .step.done{color:var(--moss);background:var(--moss-dim);}
  .step.active{color:var(--ink);font-weight:600;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 24px;margin-bottom:22px;}
  .panel h2{font-size:15px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  label{display:block;font-size:12px;color:var(--ink-muted);margin-bottom:5px;margin-top:14px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;
    font-family:'Inter';font-size:13.5px;background:#fff;color:var(--ink);
  }
  textarea{min-height:170px;resize:vertical;font-family:'IBM Plex Mono';font-size:12.5px;line-height:1.55;}
  .row{display:flex;gap:14px;}
  .row > div{flex:1;}
  .hint{font-size:11.5px;color:var(--ink-muted);margin-top:4px;}
  .run-btn{
    margin-top:20px;padding:11px 20px;background:var(--ink);color:var(--paper);border:none;
    border-radius:3px;font-family:'Inter';font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .run-btn:disabled{opacity:.5;cursor:default;}
  .run-btn:hover:not(:disabled){background:#3a342a;}

  .decision-banner{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 24px;border-radius:4px;margin-bottom:22px;border:1px solid var(--line);
  }
  .decision-banner.SELECT{background:var(--moss-dim);border-color:var(--moss);}
  .decision-banner.TEST{background:var(--amber-dim);border-color:var(--amber);}
  .decision-banner.HOLD{background:#EDE9DD;border-color:#B9AF97;}
  .decision-banner.REJECT{background:var(--rust-dim);border-color:var(--rust);}
  .decision-banner .status{font-family:'Fraunces',serif;font-size:28px;font-weight:600;}
  .decision-banner .score{font-family:'IBM Plex Mono';font-size:22px;}
  .decision-banner .reason{font-size:12.5px;color:var(--ink-muted);margin-top:4px;max-width:420px;}

  .signal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .signal-card{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:#fff;}
  .signal-card .stitle{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;}
  .signal-card .sval{font-family:'IBM Plex Mono';font-size:12px;}
  .signal-card .sval.pos{color:var(--moss);}
  .signal-card .sval.neg{color:var(--rust);}
  .signal-card .sval.zero{color:var(--ink-muted);}
  .signal-card .sinterp{font-size:12px;color:var(--ink-muted);margin-top:6px;line-height:1.4;}
  .signal-card .squote{font-size:11.5px;font-style:italic;color:#8A8270;margin-top:5px;border-left:2px solid var(--line);padding-left:8px;}
  .signal-card.unscorable{opacity:.5;}
  .conf-bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;}
  .conf-bar > div{height:100%;background:var(--ink);}

  .score-table{width:100%;border-collapse:collapse;font-size:13px;}
  .score-table td{padding:7px 0;border-bottom:1px solid var(--line);}
  .score-table td:last-child{text-align:right;font-family:'IBM Plex Mono';}
  .score-table tr:last-child td{border-bottom:none;font-weight:600;}
  .score-table .weight{color:var(--ink-muted);font-size:11.5px;}

  .flag{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:8px 10px;
    border-radius:3px;margin-top:8px;background:var(--rust-dim);color:var(--rust);
  }
  .flag.amber{background:var(--amber-dim);color:var(--amber);}

  .cbrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;}
  .cbrow input{width:auto;}

  .empty-state{padding:70px 20px;text-align:center;color:var(--ink-muted);}
  .empty-state h2{font-size:19px;color:var(--ink);margin-bottom:8px;}
  .empty-state .icon{font-size:34px;margin-bottom:14px;}

  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:-2px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{background:var(--rust-dim);color:var(--rust);padding:12px 14px;border-radius:3px;font-size:12.5px;margin-top:14px;}
  .section-note{font-size:11.5px;color:var(--ink-muted);margin-top:-6px;margin-bottom:14px;}
  .foot-actions{display:flex;gap:10px;margin-top:6px;}
  .ghost-btn{background:none;border:1px solid var(--line);padding:8px 14px;border-radius:3px;font-size:12.5px;cursor:pointer;color:var(--ink);}
  .ghost-btn:hover{background:#EFEADE;}
  .evidence-card{border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:#fff;margin-bottom:12px;}
  .evidence-card.has-error{border-color:var(--rust);background:var(--rust-dim);}
  .ev-error{color:var(--rust);font-size:12px;font-weight:600;margin-bottom:10px;display:flex;gap:6px;align-items:flex-start;}
  .or-divider{display:flex;align-items:center;gap:10px;margin:12px 0 4px;color:var(--ink-muted);font-size:11px;}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .paste-zone{border:1px dashed var(--line);border-radius:4px;padding:16px;text-align:center;cursor:text;background:#FBFAF6;}
  .paste-zone:focus{outline:2px solid var(--moss);outline-offset:1px;}
  .paste-zone.drag-over{border-color:var(--moss);background:var(--moss-dim);}
  .paste-hint{font-size:12px;color:var(--ink-muted);}
  .paste-preview{max-width:100%;max-height:160px;border-radius:3px;display:block;margin:0 auto 10px;}
  .paste-note{font-size:11.5px;color:var(--amber);margin-top:6px;}
  .exec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 0;}
  .exec-stat{padding:4px 14px;border-left:1px solid var(--line);}
  .exec-stat:first-child{border-left:none;padding-left:0;}
  .exec-label{font-size:11px;color:var(--ink-muted);margin-bottom:4px;}
  .exec-val{font-size:19px;font-weight:500;}
  .evidence-card .row{align-items:flex-end;}
  .ev-tag{display:inline-block;font-family:'IBM Plex Mono';font-size:10.5px;color:var(--ink-muted);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-right:6px;margin-top:4px;}
  .conflict-flag{font-size:10.5px;font-family:'IBM Plex Mono';padding:1px 7px;border-radius:20px;margin-left:8px;}
  .conflict-flag.LOW{background:var(--amber-dim);color:var(--amber);}
  .conflict-flag.MEDIUM,.conflict-flag.HIGH{background:var(--rust-dim);color:var(--rust);}
</style>
</head>
<body>
<div id="passGate" style="position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:999;">
  <div style="max-width:320px;width:100%;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:6px;">
    <div class="serif" style="font-size:20px;margin-bottom:6px;">Aino Selection Console</div>
    <div class="section-note" style="margin-bottom:14px;">Enter the access password to continue.</div>
    <input type="password" id="passInput" placeholder="Password" autofocus>
    <button class="run-btn" id="passSubmit" style="width:100%;margin-top:10px;">Enter</button>
    <div id="passErr" style="color:var(--rust);font-size:12px;margin-top:8px;"></div>
  </div>
</div>
<div id="app" style="display:none;">
  <div id="sidebar">
    <div class="brand">
      <div class="name">Aino</div>
      <div class="tag">Selection Engine · v2.0</div>
    </div>
    <button class="new-btn" id="newBtn">+ New assessment</button>
    <div class="queue-label">Product queue</div>
    <div class="queue" id="queue"></div>
  </div>
  <div id="main">
    <div class="wrap" id="wrap"></div>
  </div>
</div>

<script>
/* ============================= ACCESS GATE + BACKEND BRIDGE ============================= */
const APP_PASS_KEY = 'ainoAppPassword';
function getPassword(){ return sessionStorage.getItem(APP_PASS_KEY) || ''; }
async function apiStorage(action, key, value, prefix){
  const resp = await fetch('/api/storage', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-app-password':getPassword()},
    body: JSON.stringify({action, key, value, prefix})
  });
  if(resp.status===401){ showPassGate('Incorrect password.'); throw new Error('Unauthorized'); }
  return resp.json();
}
function showPassGate(err){
  document.getElementById('app').style.display='none';
  document.getElementById('passGate').style.display='flex';
  document.getElementById('passErr').textContent = err||'';
  sessionStorage.removeItem(APP_PASS_KEY);
}
async function tryUnlock(pw){
  sessionStorage.setItem(APP_PASS_KEY, pw);
  const resp = await fetch('/api/storage', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-app-password':pw},
    body: JSON.stringify({action:'get', key:'product-index'})
  });
  if(resp.status===401){
    document.getElementById('passErr').textContent = 'Incorrect password.';
    sessionStorage.removeItem(APP_PASS_KEY);
    return false;
  }
  document.getElementById('passGate').style.display='none';
  document.getElementById('app').style.display='flex';
  return true;
}
document.getElementById('passSubmit').addEventListener('click', ()=>{
  tryUnlock(document.getElementById('passInput').value).then(ok=>{ if(ok) init(); });
});
document.getElementById('passInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') document.getElementById('passSubmit').click();
});
if(getPassword()){
  tryUnlock(getPassword()).then(ok=>{ if(ok) init(); });
}
/* ============================= CONFIGURATION (v1.0.0, per spec §3.9) ============================= */
const CONFIG = {
  version: "config_v1.0.0",
  va_signal_weights: {
    animal_safety:.07, human_safety:.09, health_wellbeing:.14, comfort:.12,
    cleanliness:.10, easy_maintenance:.09, convenience:.08, interaction:.08,
    agency:.07, organisation:.05, space_efficiency:.05, aesthetics:.04
  },
  dna_composition: {
    human_safety:{human_safety:1}, animal_safety:{animal_safety:1},
    cleanliness:{cleanliness:1}, aesthetics:{aesthetics:1},
    pet_satisfaction:{health_wellbeing:.34, comfort:.33, interaction_share:.33},
    human_satisfaction:{convenience:.34, agency:.33, interaction_share:.33},
    orderliness:{organisation:.5, space_efficiency:.5},
    interaction_split:{pet_satisfaction:.5, human_satisfaction:.5}
  },
  dna_weights:{human_satisfaction:.15, pet_satisfaction:.15, human_safety:.20, animal_safety:.25, cleanliness:.10, aesthetics:.075, orderliness:.075},
  dna_thresholds:{human_safety:80, animal_safety:85, cleanliness:60, pet_satisfaction:50, human_satisfaction:50, orderliness:55, aesthetics:50, overall:70},
  coverage_thresholds:{full:80, good:60, limited:40},
  confidence_thresholds:{hold_below:.40},
  selection_weights:{va:.30, market_demand:.18, contribution_margin:.15, logistics:.12, demonstrable_value:.10, return_sizing:.08, seasonality:.07},
  decision_thresholds:{select:80, test:65, hold:50}
};
const SIGNAL_TYPES = ["animal_safety","human_safety","health_wellbeing","comfort","cleanliness","easy_maintenance","convenience","interaction","agency","organisation","space_efficiency","aesthetics"];
const SIGNAL_LABELS = {animal_safety:"Animal safety",human_safety:"Human safety",health_wellbeing:"Health & wellbeing",comfort:"Comfort",cleanliness:"Cleanliness",easy_maintenance:"Easy maintenance",convenience:"Convenience",interaction:"Interaction",agency:"Agency",organisation:"Organisation",space_efficiency:"Space efficiency",aesthetics:"Aesthetics"};
const SOURCE_TYPES = [
  {v:"supplier_page", l:"Supplier / brand page", ev:"CLAIMED"},
  {v:"marketplace", l:"Marketplace listing", ev:"CLAIMED"},
  {v:"customer_review", l:"Customer reviews", ev:"REPORTED"},
  {v:"internal_test", l:"Internal test notes", ev:"OBSERVED"},
  {v:"image", l:"Image (URL)", ev:"OBSERVED"},
  {v:"video", l:"Video (URL)", ev:"INFERRED"},
];

/* ============================= STATE ============================= */
let state = { products: [], currentId: null };
let inflight = false;

/* ============================= STORAGE (via backend) ============================= */
async function loadIndex(){
  try{
    const r = await apiStorage('get','product-index');
    return r.value ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(idx){
  await apiStorage('set','product-index', JSON.stringify(idx));
}
async function saveProduct(p){
  const evidencesForStorage = (p.evidences||[]).map(e=>{
    const { imageData, imageMediaType, ...rest } = e;
    if(imageData) rest.hadPastedImage = true;
    return rest;
  });
  const toSave = Object.assign({}, p, {evidences: evidencesForStorage});
  await apiStorage('set','product:'+p.id, JSON.stringify(toSave));
}
async function loadProduct(id){
  try{
    const r = await apiStorage('get','product:'+id);
    return r.value ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}

/* ============================= CALCULATION ENGINE (deterministic, per spec §4-8) ============================= */
function normalizedSignalScore(sig){
  if(!sig || !sig.scorable) return null;
  return ((sig.polarity*sig.strength)+4)/8*100;
}
function computeVA(signals){
  let coveredWeight=0, totalWeight=0, vaRaw=0;
  for(const t of SIGNAL_TYPES){
    const w = CONFIG.va_signal_weights[t];
    totalWeight += w;
    const s = signals[t];
    if(s && s.scorable){
      coveredWeight += w;
      vaRaw += w * (s.polarity*s.strength);
    }
  }
  const maxCovered = 4*coveredWeight, minCovered=-4*coveredWeight;
  const va = coveredWeight>0 ? ((vaRaw-minCovered)/(maxCovered-minCovered))*100 : null;
  const coverage = (coveredWeight/totalWeight)*100;
  let coverageStatus = "INSUFFICIENT";
  if(coverage>=CONFIG.coverage_thresholds.full) coverageStatus="FULL";
  else if(coverage>=CONFIG.coverage_thresholds.good) coverageStatus="GOOD";
  else if(coverage>=CONFIG.coverage_thresholds.limited) coverageStatus="LIMITED";
  const scorableConfs = SIGNAL_TYPES.filter(t=>signals[t]&&signals[t].scorable).map(t=>signals[t].confidence);
  const confidence = scorableConfs.length ? scorableConfs.reduce((a,b)=>a+b,0)/scorableConfs.length : 0;
  return {score:va, coverage, coverageStatus, confidence, coveredWeight, totalWeight};
}
function computeDNA(signals){
  const dc = CONFIG.dna_composition;
  const interactionScore = normalizedSignalScore(signals['interaction']);
  const dims = {};
  // direct 1:1 dimensions
  dims.human_safety = normalizedSignalScore(signals['human_safety']);
  dims.animal_safety = normalizedSignalScore(signals['animal_safety']);
  dims.cleanliness = normalizedSignalScore(signals['cleanliness']);
  dims.aesthetics = normalizedSignalScore(signals['aesthetics']);
  // orderliness
  {
    const parts=[['organisation',dc.orderliness.organisation],['space_efficiency',dc.orderliness.space_efficiency]];
    let sum=0,wsum=0;
    parts.forEach(([t,w])=>{const v=normalizedSignalScore(signals[t]); if(v!==null){sum+=w*v;wsum+=w;}});
    dims.orderliness = wsum>0 ? sum/wsum : null;
  }
  // pet_satisfaction: health_wellbeing .34, comfort .33, interaction_share .33 (interaction * split .5)
  {
    const compVal = interactionScore===null?null:interactionScore*dc.interaction_split.pet_satisfaction;
    const parts=[['health_wellbeing',dc.pet_satisfaction.health_wellbeing,normalizedSignalScore(signals['health_wellbeing'])],
                 ['comfort',dc.pet_satisfaction.comfort,normalizedSignalScore(signals['comfort'])],
                 ['interaction_share',dc.pet_satisfaction.interaction_share,compVal]];
    let sum=0,wsum=0;
    parts.forEach(([_,w,v])=>{if(v!==null){sum+=w*v;wsum+=w;}});
    dims.pet_satisfaction = wsum>0 ? sum/wsum : null;
  }
  // human_satisfaction: convenience .34, agency .33, interaction_share .33
  {
    const compVal = interactionScore===null?null:interactionScore*dc.interaction_split.human_satisfaction;
    const parts=[['convenience',dc.human_satisfaction.convenience,normalizedSignalScore(signals['convenience'])],
                 ['agency',dc.human_satisfaction.agency,normalizedSignalScore(signals['agency'])],
                 ['interaction_share',dc.human_satisfaction.interaction_share,compVal]];
    let sum=0,wsum=0;
    parts.forEach(([_,w,v])=>{if(v!==null){sum+=w*v;wsum+=w;}});
    dims.human_satisfaction = wsum>0 ? sum/wsum : null;
  }
  // overall A_D — renormalize over dims that are non-null
  let sum=0,wsum=0;
  for(const d in CONFIG.dna_weights){
    if(dims[d]!==null && dims[d]!==undefined){ sum += CONFIG.dna_weights[d]*dims[d]; wsum += CONFIG.dna_weights[d]; }
  }
  const overall = wsum>0 ? sum/wsum : null;
  const partial = wsum < 1 - 1e-9;
  return {dims, overall, partial};
}
function computeGate(signals, va, dna, hazardFlags){
  const failReasons=[];
  // 1. hard safety reject triggers
  const as = signals['animal_safety'], hs = signals['human_safety'];
  const hardHazard = (as && as.scorable && as.polarity<0 && as.strength>=3) ||
                      (hs && hs.scorable && hs.polarity<0 && hs.strength>=3) ||
                      hazardFlags.verified_injury || hazardFlags.manufacturer_hazard_warning || hazardFlags.structural_failure_hazard;
  if(hardHazard){
    return {gate_status:"REJECT", reason_code:"CRITICAL_SAFETY_HAZARD", critical_flags:["hard_safety_trigger"]};
  }
  // 2. evidence sufficiency
  if(va.coverage < CONFIG.coverage_thresholds.limited || va.confidence < CONFIG.confidence_thresholds.hold_below){
    return {gate_status:"HOLD", reason_code:"INSUFFICIENT_EVIDENCE", critical_flags:[]};
  }
  // 3. DNA thresholds
  for(const d in CONFIG.dna_thresholds){
    if(d==='overall') continue;
    const score = dna.dims[d];
    if(score===null){ failReasons.push(d.toUpperCase()+"_NO_EVIDENCE"); continue; }
    if(score < CONFIG.dna_thresholds[d]) failReasons.push(d.toUpperCase()+"_THRESHOLD_FAILED");
  }
  if(dna.overall===null || dna.overall < CONFIG.dna_thresholds.overall) failReasons.push("OVERALL_DNA_THRESHOLD_FAILED");
  if(failReasons.length){
    return {gate_status:"REJECT", reason_code:failReasons.join(", "), critical_flags:failReasons};
  }
  return {gate_status:"PASS", reason_code:"", critical_flags:[]};
}
function commercialTotal(est, keys){
  return keys.reduce((sum,k)=> sum + (est && typeof est[k]==='number' ? est[k] : 0), 0);
}
function marginScoreFromPercent(pct){
  if(pct>=45) return 100;
  if(pct>=35) return 80;
  if(pct>=25) return 60;
  if(pct>=15) return 40;
  if(pct>=5) return 20;
  return 0;
}
function computeCommercial(estimates, margin){
  const marketDemand = commercialTotal(estimates.market_demand, ["search_interest","market_comparables","price_acceptance","purchase_intent","competitive_gap"]);
  const logistics = commercialTotal(estimates.logistics, ["supplier_reliability","availability","lead_time","shipping_complexity","size_weight","fulfilment_damage_risk"]);
  const returnSizing = commercialTotal(estimates.return_sizing, ["sizing_ambiguity","fit_sensitivity","size_sku_complexity","wrong_size_probability","return_complexity_cost"]);
  const seasonality = commercialTotal(estimates.seasonality, ["current_season_fit","demand_window","seasonal_strength","inventory_timing_risk"]);
  const demonstrableValue = commercialTotal(estimates.demonstrable_value, ["observability","outcome_clarity","customer_reportability","pet_interaction_visibility","speed_of_learning"]);
  const price = parseFloat(margin.price)||0, cost=parseFloat(margin.cost)||0, ship=parseFloat(margin.shipping)||0,
        pay=parseFloat(margin.payment)||0, ret=parseFloat(margin.returnCost)||0, other=parseFloat(margin.other)||0;
  const marginEur = price-cost-ship-pay-ret-other;
  const marginPct = price>0 ? (marginEur/price)*100 : 0;
  const marginScore = price>0 ? marginScoreFromPercent(marginPct) : 0;
  return {marketDemand, logistics, returnSizing, seasonality, demonstrableValue, marginEur, marginPct, marginScore};
}
function computeSelectionScore(va, comm){
  const w = CONFIG.selection_weights;
  const vaScore = va.score===null?0:va.score;
  const s = w.va*vaScore + w.market_demand*comm.marketDemand + w.contribution_margin*comm.marginScore +
            w.logistics*comm.logistics + w.demonstrable_value*comm.demonstrableValue +
            w.return_sizing*comm.returnSizing + w.seasonality*comm.seasonality;
  return s;
}
function decisionFromScore(score, gate){
  if(gate.gate_status!=="PASS") return gate.gate_status; // HOLD or REJECT overrides
  const t = CONFIG.decision_thresholds;
  if(score>=t.select) return "SELECT";
  if(score>=t.test) return "TEST";
  if(score>=t.hold) return "HOLD";
  return "REJECT";
}

function buildMessageContent(evidences){
  const header = `You are the signal_extraction_v1 + signal_aggregation_v1 modules of a deterministic product-selection pipeline for a pet-products brand ("Aino Home"). You extract structured evidence ONLY from the supplied evidence items below, then aggregate them into one final view per signal. You never invent product properties, never upgrade a claim's certainty (e.g. never turn CLAIMED into VERIFIED just because it sounds plausible), and never average contradictory evidence into a false neutral — instead flag the conflict.

You will be given ${evidences.length} numbered evidence item(s), each tagged with its source_type and evidence_type. Some are pasted text, some are images (shown to you directly — inspect them visually), some are videos (referenced by URL only — you cannot see video frames, so treat video evidence as only whatever transcript/description text was supplied alongside it).

Extract exactly these 12 signal types: animal_safety, human_safety, health_wellbeing, comfort, cleanliness, easy_maintenance, convenience, interaction, agency, organisation, space_efficiency, aesthetics.

For each signal type, aggregate across ALL relevant evidence items and decide:
- scorable: true only if at least one evidence item gives usable evidence (positive, negative, or deliberate neutral). Unknown must never be scored as neutral.
- polarity: -1, 0, or 1
- strength: 0-4 (0=no signal, 4=very strong evidence)
- confidence: 0-1
- conflict_level: "NONE" | "LOW" | "MEDIUM" | "HIGH" — HIGH if evidence items disagree materially on this signal
- interpretation: one plain sentence explaining the reasoning, mentioning the conflict if any
- evidence_quote: a short (<=15 words) paraphrase supporting this, or "" if not scorable
- evidence_refs: array of the evidence item numbers (1-based) that informed this signal

Also extract:
- product: {name, category, supplier_name, selling_price (number or null), currency (string or null)}
- hazard_flags: {verified_injury: bool, manufacturer_hazard_warning: bool, structural_failure_hazard: bool} — true only if explicitly stated in evidence
- commercial_estimates: your best-effort ESTIMATE of commercial/operational sub-scores from the evidence (not verified data). Score each sub-component on the 0-to-max scale given:
  market_demand: search_interest(0-20), market_comparables(0-25), price_acceptance(0-20), purchase_intent(0-20), competitive_gap(0-15)
  logistics: supplier_reliability(0-25), availability(0-15), lead_time(0-20), shipping_complexity(0-15), size_weight(0-10), fulfilment_damage_risk(0-15)
  return_sizing: sizing_ambiguity(0-30), fit_sensitivity(0-25), size_sku_complexity(0-15), wrong_size_probability(0-15), return_complexity_cost(0-15)
  seasonality: current_season_fit(0-35), demand_window(0-25), seasonal_strength(0-20), inventory_timing_risk(0-20)
  demonstrable_value: observability(0-25), outcome_clarity(0-25), customer_reportability(0-20), pet_interaction_visibility(0-20), speed_of_learning(0-10)
- commercial_note: one short sentence flagging what's genuinely uncertain in the commercial estimate.

Respond with ONLY valid JSON, no markdown fences, no preamble, matching this shape exactly:
{"product":{"name":"","category":"","supplier_name":"","selling_price":null,"currency":null},
"signals":{"animal_safety":{"scorable":true,"polarity":0,"strength":0,"confidence":0,"conflict_level":"NONE","interpretation":"","evidence_quote":"","evidence_refs":[]}, ... (all 12 keys)},
"hazard_flags":{"verified_injury":false,"manufacturer_hazard_warning":false,"structural_failure_hazard":false},
"commercial_estimates":{"market_demand":{...},"logistics":{...},"return_sizing":{...},"seasonality":{...},"demonstrable_value":{...}},
"commercial_note":""}

Evidence items follow below, numbered in order.`;

  const content = [{type:"text", text: header}];
  evidences.forEach((ev, i)=>{
    const idx = i+1;
    const meta = SOURCE_TYPES.find(s=>s.v===ev.sourceType) || SOURCE_TYPES[0];
    if(ev.sourceType === 'image'){
      content.push({type:"text", text:`EVIDENCE ${idx} — source_type: image, evidence_type: ${meta.ev}.${ev.text?` Caption/notes: "${ev.text}"`:''} The image is attached below:`});
      if(ev.imageData){
        const b64 = ev.imageData.split(',')[1] || '';
        const mediaType = ev.imageMediaType || (ev.imageData.match(/^data:([^;]+);/)||[])[1] || 'image/png';
        content.push({type:"image", source:{type:"base64", media_type: mediaType, data: b64}});
      } else if(ev.url){
        content.push({type:"image", source:{type:"url", url: ev.url}});
      } else {
        content.push({type:"text", text:`(no image URL or pasted image was provided for evidence ${idx} — treat as not scorable)`});
      }
    } else if(ev.sourceType === 'video'){
      content.push({type:"text", text:`EVIDENCE ${idx} — source_type: video, evidence_type: ${meta.ev}. Video URL (frames not visually analyzed): ${ev.url||'(none)'}. User-provided transcript/description:\n"""${ev.text||'(none provided — treat this evidence item as not scorable)'}"""`});
    } else {
      content.push({type:"text", text:`EVIDENCE ${idx} — source_type: ${ev.sourceType}, evidence_type: ${meta.ev}. Content:\n"""${ev.text||''}"""`});
    }
  });
  return content;
}
async function safeParseResponse(resp){
  const raw = await resp.text();
  try{
    return JSON.parse(raw);
  }catch(e){
    if(resp.status===413 || /request entity too large/i.test(raw)){
      throw new Error('This evidence is too large to submit. If it includes a pasted image, try a smaller photo or crop it, then retry.');
    }
    if(!resp.ok){
      throw new Error(`Server error (${resp.status}): ${raw.slice(0,150) || 'no response body'}`);
    }
    throw new Error('Server returned an unexpected (non-JSON) response.');
  }
}
async function callClaude(content, maxTokens=4000){
  const resp = await fetch("/api/assess", {
    method:"POST",
    headers:{"Content-Type":"application/json", "x-app-password": getPassword()},
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens: maxTokens,
      messages:[{role:"user", content: content}]
    })
  });
  if(resp.status===401){ showPassGate('Session expired — please re-enter the password.'); throw new Error('Unauthorized'); }
  const data = await safeParseResponse(resp);
  if(data.error) throw new Error(data.error.message || "API error");
  const text = data.content.map(b=>b.text||"").join("");
  const clean = text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}
async function testImageUrl(url){
  try{
    const resp = await fetch("/api/assess", {
      method:"POST",
      headers:{"Content-Type":"application/json", "x-app-password": getPassword()},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens: 10,
        messages:[{role:"user", content:[{type:"text",text:"Reply with just the word OK."},{type:"image",source:{type:"url",url}}]}]
      })
    });
    const data = await safeParseResponse(resp);
    if(data.error) return data.error.message || "Unknown error";
    return null;
  }catch(e){ return e.message || String(e); }
}
function extractUrlFromError(msg){
  const m = msg.match(/https?:\/\/[^\s"')]+/);
  return m ? m[0].replace(/[.,;]+$/,'') : null;
}
function friendlyImageError(msg){
  if(/robots\.txt/i.test(msg)) return "Blocked by this site's robots.txt — the host doesn't allow automated fetching of this image. Try a different, directly-linked image URL (e.g. a CDN or media-hosting link) or paste a description instead.";
  if(/(timeout|timed out)/i.test(msg)) return "The image took too long to load from this URL. Try a different link.";
  if(/(404|not found)/i.test(msg)) return "This image URL doesn't seem to resolve (not found). Double-check the link.";
  return "Couldn't retrieve this image: " + msg;
}
async function diagnoseAndFlagEvidence(p, msg){
  const imageEvidences = p.evidences.map((e,i)=>({e,i})).filter(x=>x.e.sourceType==='image' && !x.e.imageData && x.e.url && x.e.url.trim());
  if(!imageEvidences.length) return false;
  const isFetchIssue = /robots\.txt|could not retrieve|unable to (fetch|access|retrieve)|disallowed|fetch (the )?url|error (fetching|retrieving)|invalid image|not (be )?access|failed to (fetch|download)/i.test(msg);
  if(!isFetchIssue) return false;

  const directUrl = extractUrlFromError(msg);
  if(directUrl){
    const hit = imageEvidences.find(x => directUrl.indexOf(x.e.url) !== -1 || x.e.url.indexOf(directUrl) !== -1);
    if(hit){ hit.e.error = friendlyImageError(msg); return true; }
  }
  if(imageEvidences.length === 1){
    imageEvidences[0].e.error = friendlyImageError(msg);
    return true;
  }
  // ambiguous with multiple image URLs — test each individually to pinpoint the offender(s)
  for(const {e} of imageEvidences){
    const err = await testImageUrl(e.url);
    if(err) e.error = friendlyImageError(err);
  }
  return true;
}
function buildErrorBanner(msg, p){
  const flagged = p.evidences.filter(e=>e.error);
  if(flagged.length){
    return `<div class="error-box">The assessment couldn't complete — ${flagged.length} evidence item${flagged.length>1?'s':''} above ${flagged.length>1?'are':'is'} highlighted in red. Fix or remove ${flagged.length>1?'them':'it'} and re-run.</div>`;
  }
  return `<div class="error-box">Assessment failed: ${escapeHtml(msg)}. Try again.</div>`;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Downscales/re-compresses a pasted or dropped image before it's ever
// base64-encoded, so a large phone photo doesn't blow past the server's
// request-size limit (Vercel serverless functions reject oversized bodies
// with a plain-text "Request Entity Too Large" error).
function compressImageFile(blob, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else { width = Math.round(width * (maxDim/height)); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve({ dataUrl, mimeType: 'image/jpeg' });
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Could not load image for compression')); };
    img.src = url;
  });
}

function syncEvidencesFromDOM(p){
  const old = p.evidences || [];
  const arr = [];
  document.querySelectorAll('.ev-type').forEach(sel=>{
    const idx = parseInt(sel.dataset.idx);
    arr[idx] = Object.assign({sourceType:'supplier_page', url:'', text:''}, arr[idx], {sourceType: sel.value});
  });
  document.querySelectorAll('.ev-url').forEach(inp=>{
    const idx = parseInt(inp.dataset.idx);
    arr[idx] = Object.assign({sourceType:'supplier_page', url:'', text:''}, arr[idx], {url: inp.value});
  });
  document.querySelectorAll('.ev-text').forEach(t=>{
    const idx = parseInt(t.dataset.idx);
    arr[idx] = Object.assign({sourceType:'supplier_page', url:'', text:''}, arr[idx], {text: t.value});
  });
  arr.forEach((e,i)=>{
    if(e && old[i]){
      if(old[i].error && old[i].url === e.url && old[i].sourceType === e.sourceType) e.error = old[i].error;
      if(old[i].imageData){ e.imageData = old[i].imageData; e.imageMediaType = old[i].imageMediaType; }
      if(old[i].hadPastedImage) e.hadPastedImage = true;
    }
  });
  p.evidences = arr.filter(Boolean);
}

function attachIntakeHandlers(p){
  document.getElementById('addEvidenceBtn').addEventListener('click', ()=>{
    syncEvidencesFromDOM(p);
    p.evidences.push({sourceType:'supplier_page', url:'', text:''});
    renderConsole(p);
    if(p.assessed) attachResultHandlers(p);
  });
  document.querySelectorAll('.ev-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      syncEvidencesFromDOM(p);
      p.evidences.splice(parseInt(btn.dataset.idx),1);
      renderConsole(p);
      if(p.assessed) attachResultHandlers(p);
    });
  });
  document.querySelectorAll('.ev-type').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      syncEvidencesFromDOM(p);
      renderConsole(p);
      if(p.assessed) attachResultHandlers(p);
    });
  });
  document.querySelectorAll('.paste-zone').forEach(zone=>{
    const idx = parseInt(zone.dataset.idx);
    const handleImageFile = (blob)=>{
      compressImageFile(blob, 1600, 0.82).then(({dataUrl, mimeType})=>{
        syncEvidencesFromDOM(p);
        p.evidences[idx].imageData = dataUrl;
        p.evidences[idx].imageMediaType = mimeType;
        p.evidences[idx].hadPastedImage = true;
        renderConsole(p);
        if(p.assessed) attachResultHandlers(p);
      }).catch(()=>{
        // fall back to the raw file if compression fails for any reason
        const reader = new FileReader();
        reader.onload = ()=>{
          syncEvidencesFromDOM(p);
          p.evidences[idx].imageData = reader.result;
          p.evidences[idx].imageMediaType = blob.type || 'image/png';
          p.evidences[idx].hadPastedImage = true;
          renderConsole(p);
          if(p.assessed) attachResultHandlers(p);
        };
        reader.readAsDataURL(blob);
      });
    };
    zone.addEventListener('paste', (evt)=>{
      const items = (evt.clipboardData || window.clipboardData).items;
      for(const item of items){
        if(item.type.indexOf('image')===0){
          evt.preventDefault();
          handleImageFile(item.getAsFile());
          break;
        }
      }
    });
    zone.addEventListener('dragover', (evt)=>{ evt.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('drag-over'));
    zone.addEventListener('drop', (evt)=>{
      evt.preventDefault(); zone.classList.remove('drag-over');
      const file = evt.dataTransfer.files && evt.dataTransfer.files[0];
      if(file && file.type.indexOf('image')===0) handleImageFile(file);
    });
  });
  document.querySelectorAll('.ev-clear-paste').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      syncEvidencesFromDOM(p);
      const idx = parseInt(btn.dataset.idx);
      delete p.evidences[idx].imageData;
      delete p.evidences[idx].imageMediaType;
      p.evidences[idx].hadPastedImage = false;
      renderConsole(p);
      if(p.assessed) attachResultHandlers(p);
    });
  });
  document.getElementById('runBtn').addEventListener('click', ()=> runAssessment(p));
  const suggestBtn = document.getElementById('suggestBtn');
  if(suggestBtn){
    suggestBtn.addEventListener('click', ()=>{
      readMarginFromDOM(p);
      const suggestion = computeSuggestedPrice(p.margin);
      document.getElementById('m_suggestedPrice').value = suggestion.toFixed(2);
    });
  }
  const applySuggestedBtn = document.getElementById('applySuggestedBtn');
  if(applySuggestedBtn){
    applySuggestedBtn.addEventListener('click', ()=>{
      const suggested = document.getElementById('m_suggestedPrice').value;
      document.getElementById('m_price').value = suggested;
    });
  }
}

function pctBar(conf){ return `<div class="conf-bar"><div style="width:${Math.round(conf*100)}%"></div></div>`; }

function renderResults(p){
  const { signals, va, dna, gate, decision, score, commercial, margin, hazard_flags, commercial_note } = p;
  const decisionClass = decision;
  const gateNote = gate.gate_status==='PASS' ? 'All gate checks passed.' :
    gate.gate_status==='HOLD' ? 'Coverage or confidence below the evidence threshold — gather more evidence before deciding.' :
    'A non-negotiable was violated: ' + (gate.reason_code||'critical safety hazard');

  const signalCards = SIGNAL_TYPES.map(t=>{
    const s = signals[t];
    const val = s && s.scorable ? (s.polarity*s.strength) : null;
    const cls = val===null?'':(val>0?'pos':val<0?'neg':'zero');
    const conflict = s && s.conflict_level && s.conflict_level!=='NONE' ? `<span class="conflict-flag ${s.conflict_level}">${s.conflict_level} conflict</span>` : '';
    const refs = s && s.evidence_refs && s.evidence_refs.length ? s.evidence_refs.map(r=>`<span class="ev-tag">Ev.${r}</span>`).join('') : '';
    return `<div class="signal-card ${s&&s.scorable?'':'unscorable'}">
      <div class="stitle"><span>${SIGNAL_LABELS[t]}${conflict}</span><span class="sval ${cls}">${s&&s.scorable ? (val>0?'+':'')+val : 'no evidence'}</span></div>
      ${s&&s.scorable ? `<div class="sinterp">${escapeHtml(s.interpretation||'')}</div>${s.evidence_quote?`<div class="squote">“${escapeHtml(s.evidence_quote)}”</div>`:''}${refs?`<div style="margin-top:6px;">${refs}</div>`:''}${pctBar(s.confidence)}` : `<div class="sinterp">Not addressed in the supplied evidence.</div>`}
    </div>`;
  }).join('');

  const dimRow = (label, key)=>{
    const v = dna.dims[key];
    const thr = CONFIG.dna_thresholds[key];
    const fail = v===null || v<thr;
    return `<tr><td>${label} <span class="weight">(floor ${thr})</span></td><td style="color:${fail?'var(--rust)':'var(--moss)'}">${v===null?'N/A':v.toFixed(1)}</td></tr>`;
  };

  const commRow = (label, val, w)=>`<tr><td>${label} <span class="weight">(weight ${Math.round(w*100)}%)</span></td><td>${val.toFixed(1)}</td></tr>`;

  const suggestedPriceVal = (margin.suggestedPrice!==undefined && margin.suggestedPrice!==0) ? parseFloat(margin.suggestedPrice) : computeSuggestedPrice(margin);

  return `
    <div class="decision-banner ${decisionClass}">
      <div>
        <div class="status serif">${decision==='REJECT' ? 'OVERALL SCORE' : decision}</div>
        <div class="reason">${gateNote}</div>
      </div>
      <div class="score mono">${score.toFixed(1)} / 100</div>
    </div>

    <div class="panel">
      <h2>Executive summary</h2>
      <div class="exec-grid">
        <div class="exec-stat"><div class="exec-label">V<sub>A</sub> score</div><div class="exec-val mono">${va.score===null?'N/A':va.score.toFixed(1)}</div></div>
        <div class="exec-stat"><div class="exec-label">Confidence</div><div class="exec-val mono">${(va.confidence*100).toFixed(0)}%</div></div>
        <div class="exec-stat"><div class="exec-label">Overall DNA</div><div class="exec-val mono">${dna.overall===null?'N/A':dna.overall.toFixed(1)}</div></div>
        <div class="exec-stat"><div class="exec-label">Suggested price</div><div class="exec-val mono">€${suggestedPriceVal.toFixed(2)}</div></div>
        <div class="exec-stat"><div class="exec-label">Selection Score</div><div class="exec-val mono">${score.toFixed(1)}</div></div>
      </div>
    </div>

    ${(hazard_flags.verified_injury||hazard_flags.manufacturer_hazard_warning||hazard_flags.structural_failure_hazard) ? `
    <div class="flag">⚠ Hard safety trigger detected in evidence — this forces REJECT regardless of other scores.</div>` : ''}

    <div class="panel">
      <h2>2 · Signals extracted (12 / 12 checked)</h2>
      <div class="section-note">Coverage ${va.coverage.toFixed(0)}% (${va.coverageStatus}) · aggregate confidence ${(va.confidence*100).toFixed(0)}%</div>
      <div class="signal-grid">${signalCards}</div>
    </div>

    <div class="panel">
      <h2>3 · Aino Selection Value (V<sub>A</sub>)</h2>
      <table class="score-table">
        <tr><td>V<sub>A</sub> score</td><td>${va.score===null?'N/A — no scorable signals':va.score.toFixed(1)}</td></tr>
        <tr><td>Coverage</td><td>${va.coverage.toFixed(0)}% (${va.coverageStatus})</td></tr>
        <tr><td>Confidence</td><td>${(va.confidence*100).toFixed(0)}%</td></tr>
      </table>
    </div>

    <div class="panel">
      <h2>4 · Gate &amp; DNA</h2>
      <div class="section-note">Gate status: <strong>${gate.gate_status}</strong>${gate.reason_code?' — '+escapeHtml(gate.reason_code):''}</div>
      <table class="score-table">
        ${dimRow('Human safety','human_safety')}
        ${dimRow('Animal safety','animal_safety')}
        ${dimRow('Cleanliness','cleanliness')}
        ${dimRow('Pet satisfaction','pet_satisfaction')}
        ${dimRow('Human satisfaction','human_satisfaction')}
        ${dimRow('Orderliness','orderliness')}
        ${dimRow('Aesthetics','aesthetics')}
        <tr><td>Overall DNA (A<sub>D</sub>)</td><td>${dna.overall===null?'N/A':dna.overall.toFixed(1)}</td></tr>
      </table>
      ${dna.partial ? '<div class="flag amber">DNA computed on partial signal coverage — treat as provisional.</div>' : ''}
    </div>

    <div class="panel">
      <h2>5 · Commercial &amp; operational scoring</h2>
      <div class="section-note">${escapeHtml(commercial_note||'')} Sub-scores below are AI estimates from the pasted text — verify before relying on them commercially.</div>
      <table class="score-table">
        ${commRow('Market demand', commercial.marketDemand, CONFIG.selection_weights.market_demand)}
        ${commRow('Logistics', commercial.logistics, CONFIG.selection_weights.logistics)}
        ${commRow('Return / sizing risk', commercial.returnSizing, CONFIG.selection_weights.return_sizing)}
        ${commRow('Seasonality', commercial.seasonality, CONFIG.selection_weights.seasonality)}
        ${commRow('Demonstrable value', commercial.demonstrableValue, CONFIG.selection_weights.demonstrable_value)}
      </table>

      <div class="section-note" style="margin-top:14px;">Pricing &amp; cost inputs live in the Evidence intake section above — edit them there, then recalculate here.</div>
      <button class="run-btn" id="recalcBtn" style="margin-top:6px;">Recalculate margin &amp; selection score</button>
      <table class="score-table" style="margin-top:14px;">
        <tr><td>Contribution margin</td><td>€${commercial.marginEur.toFixed(2)} (${commercial.marginPct.toFixed(1)}%)</td></tr>
        <tr><td>Margin score</td><td>${commercial.marginScore}</td></tr>
      </table>
    </div>

    <div class="panel">
      <h2>6 · Selection score &amp; decision</h2>
      <table class="score-table">
        ${commRow('Aino Selection Value (V<sub>A</sub>)', va.score===null?0:va.score, CONFIG.selection_weights.va)}
        ${commRow('Market demand', commercial.marketDemand, CONFIG.selection_weights.market_demand)}
        ${commRow('Contribution margin', commercial.marginScore, CONFIG.selection_weights.contribution_margin)}
        ${commRow('Logistics', commercial.logistics, CONFIG.selection_weights.logistics)}
        ${commRow('Demonstrable value', commercial.demonstrableValue, CONFIG.selection_weights.demonstrable_value)}
        ${commRow('Return / sizing', commercial.returnSizing, CONFIG.selection_weights.return_sizing)}
        ${commRow('Seasonality', commercial.seasonality, CONFIG.selection_weights.seasonality)}
        <tr><td>Selection Score (S)</td><td>${score.toFixed(1)}</td></tr>
      </table>
      <div class="section-note" style="margin-top:10px;">Config ${CONFIG.version} · thresholds: SELECT ≥80, TEST ≥65, HOLD ≥50, else REJECT. A Gate HOLD/REJECT always overrides the score band.</div>
      <div class="foot-actions">
        <button class="ghost-btn" id="deleteBtn">Delete this assessment</button>
      </div>
    </div>
  `;
}

/* ============================= FLOW ============================= */
function blankProduct(){
  return {
    id: uid(), name:'', evidences:[{sourceType:'supplier_page', url:'', text:''}],
    assessed:false, created_at:Date.now(), updated_at:Date.now(),
    margin:{price:0,cost:0,shipping:0,payment:0,returnCost:0,other:0,targetMarginPct:30,suggestedPrice:0}
  };
}
function migrateProduct(p){
  if(!p.evidences){
    p.evidences = [{sourceType:p.sourceType||'supplier_page', url:p.sourceUrl||'', text:p.rawText||''}];
  }
  return p;
}
function computeSuggestedPrice(margin){
  const totalCosts = (parseFloat(margin.cost)||0)+(parseFloat(margin.shipping)||0)+(parseFloat(margin.payment)||0)+(parseFloat(margin.returnCost)||0)+(parseFloat(margin.other)||0);
  const targetPct = Math.min(parseFloat(margin.targetMarginPct)||30, 99);
  return totalCosts>0 ? totalCosts/(1-(targetPct/100)) : 0;
}
async function createNewProduct(){
  const p = blankProduct();
  state.currentId = p.id;
  state.products.push(p);
  renderSidebar();
  renderConsole(p);
}
async function openProduct(id){
  let p = state.products.find(x=>x.id===id);
  if(!p){ p = await loadProduct(id); if(p) state.products.push(p); }
  migrateProduct(p);
  state.currentId = id;
  renderSidebar();
  renderConsole(p);
  attachResultHandlers(p);
}
function readMarginFromDOM(p){
  p.margin = {
    price:document.getElementById('m_price').value, cost:document.getElementById('m_cost').value,
    shipping:document.getElementById('m_shipping').value, payment:document.getElementById('m_payment').value,
    returnCost:document.getElementById('m_returnCost').value, other:document.getElementById('m_other').value,
    targetMarginPct:document.getElementById('m_targetMargin').value,
    suggestedPrice:document.getElementById('m_suggestedPrice').value
  };
}
function attachResultHandlers(p){
  const recalc = document.getElementById('recalcBtn');
  if(recalc){
    recalc.addEventListener('click', async ()=>{
      readMarginFromDOM(p);
      p.commercial = computeCommercial(p.commercial_estimates, p.margin);
      p.score = computeSelectionScore(p.va, p.commercial);
      p.decision = decisionFromScore(p.score, p.gate);
      p.updated_at = Date.now();
      await saveProduct(p);
      await persistIndex();
      renderSidebar();
      renderConsole(p);
      attachResultHandlers(p);
    });
  }
  const del = document.getElementById('deleteBtn');
  if(del){
    del.addEventListener('click', async ()=>{
      state.products = state.products.filter(x=>x.id!==p.id);
      await apiStorage('delete', 'product:'+p.id).catch(()=>{});
      await persistIndex();
      state.currentId = null;
      renderSidebar();
      renderEmpty();
    });
  }
}
async function persistIndex(){
  const idx = state.products.map(p=>({id:p.id, name:p.name, score:p.score, decision:p.decision, updated_at:p.updated_at}));
  await saveIndex(idx);
}

async function runAssessment(p){
  if(inflight) return;
  syncEvidencesFromDOM(p);
  p.evidences.forEach(e=> e.error = null);
  const errBox = document.getElementById('errBox');
  errBox.innerHTML='';
  const hasContent = p.evidences.some(ev => (ev.text&&ev.text.trim()) || (ev.url&&ev.url.trim()) || ev.imageData);
  if(!hasContent){
    errBox.innerHTML = `<div class="error-box">Add at least one evidence source (pasted text or a URL) before running the assessment.</div>`;
    return;
  }
  inflight = true;
  renderConsole(p);
  try{
    const content = buildMessageContent(p.evidences);
    const result = await callClaude(content);

    p.name = result.product && result.product.name ? result.product.name : (p.name || 'Untitled product');
    p.product = result.product;
    p.signals = result.signals;
    p.hazard_flags = result.hazard_flags || {};
    p.commercial_estimates = result.commercial_estimates || {};
    p.commercial_note = result.commercial_note || '';

    if(result.product && result.product.selling_price && !parseFloat(p.margin.price)){
      p.margin.price = result.product.selling_price;
    }

    p.va = computeVA(p.signals);
    p.dna = computeDNA(p.signals);
    p.gate = computeGate(p.signals, p.va, p.dna, p.hazard_flags);
    p.commercial = computeCommercial(p.commercial_estimates, p.margin);
    p.score = computeSelectionScore(p.va, p.commercial);
    p.decision = decisionFromScore(p.score, p.gate);
    p.assessed = true;
    p.updated_at = Date.now();

    await saveProduct(p);
    await persistIndex();
    inflight = false;
    renderSidebar();
    renderConsole(p);
    attachResultHandlers(p);
  }catch(e){
    inflight = false;
    const msg = e.message || String(e);
    await diagnoseAndFlagEvidence(p, msg);
    renderConsole(p);
    if(p.assessed) attachResultHandlers(p);
    document.getElementById('errBox').innerHTML = buildErrorBanner(msg, p);
  }finally{
    inflight = false;
  }
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty-state">
      <div class="icon">◆</div>
      <h2 class="serif">No product open</h2>
      <div>Start a new assessment or pick one from the queue on the left.</div>
    </div>`;
}

/* ============================= INIT ============================= */
async function init(){
  document.getElementById('newBtn').addEventListener('click', createNewProduct);
  const idx = await loadIndex();
  if(idx.length){
    for(const item of idx){
      const p = await loadProduct(item.id);
      if(p) state.products.push(migrateProduct(p));
    }
  }
  renderSidebar();
  if(state.products.length){
    openProduct(state.products.slice().sort((a,b)=>b.updated_at-a.updated_at)[0].id);
  } else {
    createNewProduct();
  }
}

</script>
